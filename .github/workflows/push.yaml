  security:

    strategy:
      matrix:
        operating-system: [ubuntu-latest]

    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: clj-holmes (Clojure)
        uses: samumbach/clj-holmes-action@more-github-action-inputs
        with:
          output-type: 'stdout'
          fail-on-result: 'true'
          #ignored-paths: "\n\\.cljs$\n^test/\n\n \n\n\t\n\t \n"
          #rule-tags: " security  \n\t\tvulnerability\t\n\t ssl\t "
          #rule-severities: "\t \terror \t \n\nwarning\ninfo"
          #rule-precisions: "low\n\nmedium\n   high\t\t\t\nvery-high"
          #extra-scan-args: "--ignored-paths\n\\.cljs$\n--ignored-paths\n^test/\n--rule-tags\nsecurity\n--rule-tags\nvulnerability\n--rule-tags\nssl\n--rule-severity\nerror\n--rule-severity\nwarning\n--rule-severity\ninfo\n--rule-precision\nlow\n--rule-precision\nmedium\n--rule-precision\nhigh\n--rule-precision\n\n--rule-precision\n \n--rule-precision\n\t\n--rule-precision\nvery-high"
          extra-scan-args-sh: "--ignored-paths '\\.cljs$' --ignored-paths '^test/' --rule-tags \"security\"    --rule-tags\t'vulnerability' \t --rule-tags  ssl --rule-severity error --rule-severity  warning --rule-severity info --rule-precision\nlow\n--rule-precision medium --rule-precision high --rule-precision\n'\n' --rule-precision\n\" \"\n--rule-precision\n\"\t\" --rule-precision very-high   \t\n\t "
